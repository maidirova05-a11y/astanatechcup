name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default token needs nothing beyond reading the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Locale catalogs, types and lint. `check:messages` is the one that
      # catches a missing translation before a user sees an untranslated
      # string on a national championship's home page.
      - name: Check
        run: npm run check

      # No secrets are provided on purpose. src/lib/env.ts skips the
      # production readiness gate during NEXT_PHASE=phase-production-build,
      # so a build that needs a real DATABASE_URL to compile is a regression
      # this step is meant to catch.
      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Fails only on high/critical. The known moderate advisory is a
      # dev-only esbuild issue reached through drizzle-kit — see SECURITY.md,
      # where the decision not to downgrade is recorded.
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
